[project]
name = "rag-aws"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "komal-adimulam", email = "komal.adimulam@fissionlabs.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.6",
    "langchain-huggingface>=1.2.2",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-text-splitters>=1.1.2",
    "llama-index-core>=0.14.24",
    "llama-index-readers-file>=0.6.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
rag-aws = "rag_aws:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
